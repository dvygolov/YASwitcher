<!doctype html><html><head><meta charset="utf-8">
<style>
body{margin:0;background:#0f1013;display:grid;place-items:center;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}
.panel{width:520px;background:#1E1E22;border:1px solid #3A3A44;border-radius:10px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.search{height:44px;background:#2A2A30;border-radius:8px;display:flex;align-items:center;padding:0 14px;gap:8px;color:#9A9AA6;font-size:20px}
.search .mon{margin-left:auto;font-size:13px;color:#8FD18F}
.rows{margin-top:8px}
.row{height:52px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:8px}
.row.sel{background:#2F4B7C}
.ic{width:32px;height:32px;border-radius:6px;background:#2A2A30;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.t{color:#E8E8EC;font-size:17px;line-height:1.15}
.t .m{color:#6FB4FF}
.s{color:#9A9AA6;font-size:13px}
.row.sel .t{color:#fff}.row.sel .s{color:#C7D6F2}
.foot{margin-top:8px;padding:0 4px;font-size:13px;color:#9A9AA6}
</style></head><body>
<div class="panel">
  <div class="search">🔎 ch<span class="mon">Monitor 2 · 2560×1440</span></div>
  <div class="rows">
    <div class="row sel"><div class="ic">🌐</div><div><div class="t"><span class="m">Ch</span>rome — GitHub · Pull requests</div><div class="s">chrome</div></div></div>
    <div class="row"><div class="ic">💬</div><div><div class="t">Slack — #general</div><div class="s">slack</div></div></div>
    <div class="row"><div class="ic">📝</div><div><div class="t">Visual Studio Code — <span class="m">ch</span>ange window.go</div><div class="s">code</div></div></div>
    <div class="row"><div class="ic">📁</div><div><div class="t">File Explorer — Downloads</div><div class="s">explorer</div></div></div>
    <div class="row"><div class="ic">▶️</div><div><div class="t">YouTube — Music</div><div class="s">chrome</div></div></div>
    <div class="row"><div class="ic">🧾</div><div><div class="t">Notepad — notes.txt</div><div class="s">notepad</div></div></div>
  </div>
  <div class="foot">Enter to switch · Esc to close</div>
</div>
</body></html>
